[metadata]
name = pqcsim
version = 0.2.0
description = Device-to-circuit simulation of photonic and optoelectronic chips: PCM devices, arrays, lossy linear optics, quantum states and electronics
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.21
    scipy>=1.7
    pyyaml>=5.4

[options.packages.find]
include = pqcsim*

[options.extras_require]
test = pytest>=7
bench =
    pytest>=7
    tmm
    thewalrus
    perceval-quandela
    fipy
